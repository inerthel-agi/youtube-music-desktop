<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Now playing</title>
<style>
  /* OBS Browser source: transparent page, one card. Restyle it with the
     source's "Custom CSS" field (classes below are stable). */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font: 15px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; padding: 8px; }
  .card { display: flex; align-items: center; gap: 14px; max-width: 480px; padding: 12px;
          border-radius: 14px; background: rgba(10, 10, 10, .78); box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
          opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
  .card.show { opacity: 1; transform: none; }
  .art { position: relative; width: 72px; height: 72px; flex: none; border-radius: 8px;
         background: #222 center / cover no-repeat; }
  .art .paused { position: absolute; inset: 0; display: none; place-items: center; border-radius: 8px;
                 background: rgba(0, 0, 0, .5); }
  .card.is-paused .paused { display: grid; }
  .paused svg { width: 28px; height: 28px; fill: #fff; }
  .info { flex: 1; min-width: 0; }
  .title, .artist { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-weight: 600; font-size: 17px; }
  .artist { color: rgba(255, 255, 255, .72); margin-top: 2px; }
  .time { display: flex; align-items: center; gap: 8px; margin-top: 6px;
          font-size: 12px; color: rgba(255, 255, 255, .72); font-variant-numeric: tabular-nums; }
  .progress { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .2); overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: #ff0033; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="art" id="art"><div class="paused"><svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></div></div>
    <div class="info">
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="time"><span id="elapsed">0:00</span><div class="progress"><div id="bar"></div></div><span id="total">0:00</span></div>
    </div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const clock = (sec) => {
    const t = Math.max(0, Math.floor(sec));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = String(t % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
  };
  // Elapsed time ticks once a second, only while playing.
  let tick = null;
  function startClock(s) {
    clearInterval(tick);
    const from = Date.now();
    const show = () => {
      const pos = s.position + (s.playing ? (Date.now() - from) / 1000 : 0);
      $('elapsed').textContent = clock(s.duration > 0 ? Math.min(pos, s.duration) : pos);
    };
    show();
    if (s.playing) tick = setInterval(show, 1000);
  }
  // Text through textContent only; the artwork URL was validated by the app.
  function render(s) {
    const track = !s.ad && !!s.title;
    $('card').classList.toggle('show', track);
    $('card').classList.toggle('is-paused', track && !s.playing);
    if (!track) { clearInterval(tick); return; }
    $('title').textContent = s.title;
    $('artist').textContent = [s.artist, s.album].filter(Boolean).join(' • ');
    $('art').style.backgroundImage = s.artwork ? `url("${encodeURI(s.artwork)}")` : 'none';
    $('total').textContent = s.duration > 0 ? clock(s.duration) : '';
    startClock(s);
    // Progress: one CSS transition per state change, no timer.
    const bar = $('bar');
    bar.style.transition = 'none';
    bar.style.width = `${s.duration > 0 ? Math.min(100, (s.position / s.duration) * 100) : 0}%`;
    if (s.playing && s.duration > s.position) {
      bar.getBoundingClientRect();
      bar.style.transition = `width ${s.duration - s.position}s linear`;
      bar.style.width = '100%';
    }
  }
  const events = new EventSource('/events'); // reconnects by itself when the app restarts
  events.onmessage = (e) => render(JSON.parse(e.data));
  events.onerror = () => $('card').classList.remove('show');
</script>
</body>
</html>
