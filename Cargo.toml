[workspace]
resolver = "3"
members = ["crates/ytm-core", "apps/desktop", "apps/hybrid"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ytm-core = { path = "crates/ytm-core" }
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-build = "2.5"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
